<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title description">
  <title id="title">dotagents mark</title>
  <desc id="description">A friendly constellation of AI agents held in one orbit.</desc>
  <defs>
